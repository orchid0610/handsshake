name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: jobs can only read, except the publish job below.
permissions:
  contents: read

env:
  # Pin these to exact versions once you're happy (run `wails version` locally).
  WAILS_VERSION: latest
  NFPM_VERSION: latest

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go test -tags webkit2_41 ./internal/...

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails and nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
      - name: Build
        run: wails build -clean -tags webkit2_41
      - name: Package
        run: |
          mkdir -p dist stage
          cp build/bin/handsshake LICENSE README.md stage/
          tar -czf dist/handsshake-linux-amd64.tar.gz -C stage .
          VERSION="${GITHUB_REF_NAME#v}" nfpm package -p deb -f nfpm.yaml -t dist/
          mv dist/*.deb dist/handsshake-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Build (universal, Apple Silicon + Intel)
        run: wails build -clean -platform darwin/universal
      - name: Ad-hoc sign and package as a zip
        run: |
          APP=$(ls -d build/bin/*.app | head -n 1)
          if [ "$APP" != "build/bin/HandSSHake.app" ]; then
            mv "$APP" build/bin/HandSSHake.app
          fi
          codesign --force --deep --sign - build/bin/HandSSHake.app
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/HandSSHake.app dist/handsshake-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the asset names the installer relies on
        run: |
          cd dist
          for f in handsshake-linux-amd64.deb handsshake-linux-amd64.tar.gz handsshake-macos-universal.zip; do
            test -f "$f" || { echo "missing release asset: $f"; exit 1; }
          done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true