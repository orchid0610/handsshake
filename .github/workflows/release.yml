name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Pin these to exact versions once you're happy (run `wails version` locally).
  WAILS_VERSION: latest
  NFPM_VERSION: latest

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails and nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}

      - name: Test
        run: go test -tags webkit2_41 ./internal/...

      - name: Build
        run: wails build -clean -tags webkit2_41

      - name: Package
        run: |
          mkdir -p dist stage
          cp build/bin/handsshake LICENSE README.md stage/
          tar -czf "dist/handsshake-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C stage .
          VERSION="${GITHUB_REF_NAME#v}" nfpm package -p deb -f nfpm.yaml -t dist/
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true